<div class="min-h-screen transition-colors" style="background: var(--bg); color: var(--text); font-family: var(--font-body)">

  <header class="sticky top-0 z-20 px-4 md:px-6 pt-4 flex flex-wrap items-stretch gap-3">
    <!-- Panel de navegación -->
    <div class="flex-[1_1_620px] min-w-0 rounded-[14px] flex items-center gap-4 pl-[18px] pr-3 py-2.5"
      style="background: color-mix(in srgb, var(--card-bg) 82%, transparent); backdrop-filter: blur(14px); box-shadow: var(--card-shadow)">
      <a routerLink="/home" class="flex-none">
        <img src="assets/img/tasker_logo.png" alt="Tasker" class="h-16 w-auto object-contain" />
      </a>

      <span class="w-px self-stretch my-1 flex-none" style="background: var(--divider)"></span>

      <nav class="flex gap-1 flex-1 min-w-0 overflow-x-auto" style="scrollbar-width: none">
        @for (tab of tabs; track tab.path) {
          <a [routerLink]="tab.path"
            routerLinkActive="!bg-[var(--color-accent-900)] !border-[var(--color-accent-700)] !text-[var(--color-accent-200)]"
            class="flex-none flex items-center gap-1.5 whitespace-nowrap rounded-full px-3.5 py-2 text-[13px] font-medium border border-transparent transition-colors hover:text-[var(--text)]"
            style="color: var(--color-neutral-400)">
            <i class="pi {{ tab.icon }} text-sm"></i>{{ tab.label }}
          </a>
        }
      </nav>

      <div class="flex items-center gap-1 flex-none">
        <button type="button" class="icon-btn rounded-[10px]" title="Buscar"><i class="pi pi-search"></i></button>
        <button type="button" class="icon-btn rounded-[10px] relative" title="Notificaciones">
          <i class="pi pi-bell"></i>
          <span class="absolute top-2 right-2 w-[7px] h-[7px] rounded-full" style="background: var(--accent)"></span>
        </button>
      </div>
    </div>

    <!-- Panel de usuario / saludo -->
    <div class="flex-[1_1_260px] min-w-0 rounded-[14px] flex items-center gap-3 px-4 py-2.5 overflow-hidden"
      style="box-shadow: var(--card-shadow); background: linear-gradient(120deg, var(--color-accent-900), var(--color-surface))">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-medium flex-none"
        style="background: var(--color-accent-800); color: var(--color-accent-100); box-shadow: 0 0 0 2px var(--color-accent-700), 0 0 18px color-mix(in srgb, var(--color-accent) 35%, transparent)">
        {{ initials() }}
      </div>
      <div class="min-w-0 flex-1">
        <div class="text-base font-medium leading-tight truncate">Buen día{{ username() ? ', ' + username() : '' }}</div>
        <div class="text-xs truncate" style="color: var(--color-neutral-400)">{{ todayLabel }}</div>
      </div>
      <button type="button" (click)="logout()" title="Cerrar sesión" class="icon-btn rounded-[10px] flex-none">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </header>

  <main class="px-4 md:px-6 pt-7 pb-28">
    <router-outlet />
  </main>

  <p-toast position="bottom-right" />
  <p-confirmdialog />
</div>
