<div class="flex flex-col gap-6">

  <!-- Encabezado -->
  <div class="text-center">
    <img src="assets/img/tasker_logo.png" alt="Tasker logo" class="h-48 mx-auto mb-4 -rotate-12" />
    <h2 class="text-3xl font-bold text-gray-900 mb-1">Iniciar sesión</h2>
    <p class="text-gray-500 text-sm">Ingresá tus credenciales para continuar</p>
  </div>

  <!-- Formulario -->
  <form class="flex flex-col gap-5">

    <!-- Email -->
    <div class="flex flex-col gap-1">
      <label for="email" class="text-sm font-medium text-gray-700">Correo electrónico</label>
      <input
        pInputText
        id="email"
        type="email"
        placeholder="usuario@utn.edu.ar"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm font-medium text-gray-700">Contraseña</label>
      <p-password
        inputId="password"
        placeholder="••••••••"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </div>

    <p-button
      label="Ingresar"
      type="submit"
      styleClass="w-full"
      size="large"
    />

    <div class="text-center">
      <a href="#" class="text-sm font-medium" style="color: #7c3aed;">¿Olvidaste tu contraseña?</a>
    </div>

  </form>

  <!-- Separador -->
  <p-divider>
    <span class="text-sm text-gray-400 px-2">o continuá con</span>
  </p-divider>

  <!-- Botón Google -->
  <p-button
    styleClass="w-full"
    severity="secondary"
    variant="outlined"
    size="large"
  >
    <ng-template #content>
      <span class="flex items-center justify-center gap-3 w-full">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5 shrink-0">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        <span class="font-medium">Continuar con Google</span>
      </span>
    </ng-template>
  </p-button>

</div>
