<div class="h-screen bg-gray-50 flex items-center justify-center px-4 relative overflow-hidden">

  <!-- Blobs decorativos -->
  <div class="absolute top-0 left-0 w-72 h-72 bg-violet-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 translate-x-1/3 translate-y-1/3 pointer-events-none"></div>

  <div class="relative text-center max-w-lg w-full">

    <!-- Número 404 -->
    <div class="relative inline-block mb-6">
      <span class="text-[10rem] sm:text-[12rem] font-black leading-none select-none"
            style="background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
        404
      </span>
      <!-- Icono flotante -->
      <div class="absolute -top-4 -right-6 bg-white rounded-2xl shadow-lg p-3 rotate-12">
        <i class="pi pi-search text-violet-500 text-2xl"></i>
      </div>
    </div>

    <!-- Mensaje principal -->
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-3">
      Página no encontrada
    </h1>
    <p class="text-gray-500 text-base sm:text-lg mb-10 leading-relaxed">
      La página que buscás no existe o fue movida.<br>
      Revisá la URL o volvé al inicio.
    </p>

    <!-- Acciones -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <p-button
        label="Volver al inicio"
        icon="pi pi-home"
        routerLink="/"
        size="large"
        styleClass="px-6"
      />
      <p-button
        label="Ir atrás"
        icon="pi pi-arrow-left"
        severity="secondary"
        variant="outlined"
        size="large"
        styleClass="px-6"
        (click)="goBack()"
      />
    </div>

  </div>

  <!-- Copyright -->
  <p class="absolute bottom-4 text-sm text-gray-400 select-none">
    &copy; {{ currentYear }} Tasker. Todos los derechos reservados.
  </p>

</div>
